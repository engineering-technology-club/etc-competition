<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>مسابقة انطلاقة النادي – ETC</title>
  <meta name="description" content="مسابقة فعالية انطلاقة النادي الهندسي والتكنولوجي (ETC)" />
  <meta name="theme-color" content="#17264F" />
  <link rel="icon" href="images/club-app-icon.png" />
  <link rel="apple-touch-icon" href="images/club-app-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="net" class="net" hidden>الاتصال ضعيف… بنحاول نرجع</div>

  <header class="top">
    <div class="disc sm"><img src="images/club-logo.png" alt="" /></div>
    <div class="brand"><b>ETC</b><small>Engineering &amp; Technology Club</small></div>
    <span id="who" class="who"></span>
  </header>

  <main class="wrap">
    <!-- التسجيل -->
    <section id="join" data-view hidden>
      <div class="disc xl"><img src="images/club-logo.png" alt="شعار النادي الهندسي والتكنولوجي" /></div>
      <span class="ev">فعالية انطلاقة النادي الهندسي والتكنولوجي</span>
      <h1>مسابقة <em>الانطلاقة</em></h1>
      <form id="joinForm" class="card" autocomplete="off">
        <div class="field">
          <label for="nm">اسمك بالمسابقة</label>
          <input id="nm" maxlength="24" placeholder="مثلاً: أحمد محمد" enterkeyhint="go" required />
        </div>
        <button class="btn wide" style="margin-top:14px">دخول المسابقة</button>
      </form>
      <p class="hint">اكتب اسمك الحقيقي عشان نقدر نعلن الفائزين 🏆</p>
    </section>

    <!-- الانتظار -->
    <section id="wait" data-view hidden>
      <div class="disc lg breath"><img src="images/club-logo.png" alt="" /></div>
      <h2 id="wt"></h2>
      <p id="wm" class="mut"></p>
      <div class="dots"><i></i><i></i><i></i></div>
      <button id="rename" class="link" type="button">تغيير الاسم</button>
    </section>

    <!-- السؤال -->
    <section id="q" data-view hidden>
      <div class="qhead">
        <div style="text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-start">
          <span class="chip" id="qn"></span>
          <span class="hint" id="qHint">كل ما أسرع، نقاط أكثر ⚡</span>
        </div>
        <div id="ringSlot"></div>
      </div>
      <div class="bar"><i id="br"></i></div>
      <div class="card paper qcard"><p id="qt"></p></div>
      <div id="op" class="opts" role="group" aria-label="الخيارات"></div>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <!-- نتيجة السؤال -->
    <section id="res" data-view hidden>
      <div id="rIcon" class="verdict"></div>
      <h2 id="rh"></h2>
      <p id="rp" class="pts"></p>
      <div class="card paper answer" style="--ac:var(--green)">
        <small>الإجابة الصحيحة</small>
        <div id="rc"></div>
        <p id="rMine" class="mine" hidden></p>
      </div>
      <p class="mut">بانتظار عرض الترتيب…</p>
    </section>

    <!-- الترتيب -->
    <section id="bd" data-view hidden>
      <span id="bChip" class="chip out"></span>
      <h2 id="bh"></h2>
      <div id="me" class="mecard"></div>
      <div id="podium" class="podium"></div>
      <div id="ls" class="list"></div>
    </section>
  </main>

  <script type="module" src="js/player.js"></script>
</body>
</html>
