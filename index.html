<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مسابقة النادي الهندسي والتكنولوجي</title><meta name="theme-color" content="#02030a">
<link rel="icon" href="images/club-app-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<link rel="stylesheet" href="css/style.css"></head><body><main>
<img class="logo" src="images/club-logo.png" alt="ETC">
<section id="join" class="v" hidden><h1>مسابقة <em>انطلاقة</em> النادي</h1><p class="sub">Engineering &amp; Technology Club</p>
<div class="card"><input id="nm" maxlength="24" placeholder="اكتب اسمك" autocomplete="off"><button id="go">دخول</button></div></section>
<section id="wait" class="v" hidden><h1 id="wt"></h1><p class="mut" id="wm">بانتظار بدء السؤال، خليك جاهز</p><div class="dots"><i></i><i></i><i></i></div></section>
<section id="q" class="v" hidden><div class="bar"><i id="br"></i></div>
<div class="meta"><span id="qn"></span><b id="tm"></b></div><h2 id="qt"></h2><div id="op"></div><p id="msg" class="mut"></p></section>
<section id="res" class="v" hidden><h1 id="rh"></h1><div class="card" id="rc"></div><p class="mut">بانتظار عرض الترتيب...</p></section>
<section id="bd" class="v" hidden><h1 id="bh"></h1><div id="me" class="card"></div>
<div id="podium" class="podium"></div><div id="ls"></div></section>
</main>
<script type="module">
import {db} from "./firebase-config.js";
import {doc,setDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const $=i=>document.getElementById(i);
const show=i=>document.querySelectorAll('.v').forEach(e=>e.hidden=e.id!=i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const pid=localStorage.pid||(localStorage.pid=crypto.randomUUID().replace(/-/g,''));
let name=localStorage.name||'',off=0,st={phase:'lobby'},mine={},tick;

const reg=()=>setDoc(doc(db,'players',pid),{name,joinedAt:serverTimestamp()}).catch(()=>{});
onSnapshot(doc(db,'players',pid),s=>{const j=s.data()?.joinedAt;if(j&&!s.metadata.hasPendingWrites)off=j.toMillis()-Date.now()});
$('go').onclick=()=>{const v=$('nm').value.trim();if(!v)return;name=localStorage.name=v;reg();render()};
$('nm').onkeydown=e=>{if(e.key=='Enter')$('go').click()};
if(name)reg();
onSnapshot(doc(db,'live','state'),s=>{st=s.data()||{phase:'lobby'};render()});
render();

function render(){
  clearInterval(tick);
  if(!name)return show('join');
  if(st.phase=='question')return question();
  if(st.phase=='results')return results();
  if(st.phase=='board'||st.phase=='final')return board();
  $('wt').textContent='أهلاً '+name; $('wm').textContent='بانتظار بدء السؤال، خليك جاهز'; show('wait');
}
function question(){
  show('q');$('qt').textContent=st.text;$('qn').textContent=`السؤال ${st.idx+1} من ${st.total}`;
  const done=mine[st.qid]!=null,op=$('op');op.replaceChildren();
  st.options.forEach((t,i)=>{const b=el('button','opt'+(mine[st.qid]===i?' sel':''),t);b.disabled=done;b.onclick=()=>pick(i);op.append(b)});
  $('msg').textContent=done?'تم تسجيل إجابتك':'';
  const t0=st.startedAt?.toMillis();if(!t0)return;
  const run=()=>{
    const left=Math.max(0,st.duration-(Date.now()+off-t0)/1000);
    $('tm').textContent=Math.ceil(left);$('br').style.width=left/st.duration*100+'%';
    if(left<=0){op.querySelectorAll('button').forEach(b=>b.disabled=true);if(mine[st.qid]==null)$('msg').textContent='انتهى الوقت، بانتظار إغلاق السؤال';clearInterval(tick)}
  };
  run();tick=setInterval(run,100);
}
async function pick(i){
  const q=st.qid;if(mine[q]!=null)return;mine[q]=i;question();
  try{await setDoc(doc(db,'answers',q+'_'+pid),{u:pid,n:name,c:i,q,t:serverTimestamp()})}
  catch(e){$('msg').textContent='الوقت انتهى، لم تُحسب الإجابة'}
}
function results(){
  show('res');
  const myAns = mine[st.qid];
  const isCorrect = myAns === st.correct;
  $('rh').textContent = isCorrect ? 'إجابة صحيحة! 🎉' : (myAns!=null ? 'إجابة خاطئة 😔' : 'لم تجب ⏳');
  $('rh').style.color = isCorrect ? 'var(--ok)' : (myAns!=null ? 'var(--bad)' : 'var(--mut)');
  $('rc').innerHTML = `<h3>الإجابة الصحيحة كانت:</h3><p style="font-size:20px;color:var(--c);margin-top:10px">${st.options[st.correct]}</p>`;
}
function board(){
  show('bd');const fin=st.phase=='final',L=st.board||[];
  $('bh').textContent=fin?'النتيجة النهائية':'الترتيب الحالي';
  const i=L.findIndex(x=>x.u==pid),m=L[i];
  $('me').textContent=m?`ترتيبك: ${i+1}، نقاطك: ${m.s}`+(m.d&&!fin?` (+${m.d} هذا السؤال)`:''):'جاهز للسؤال القادم';
  
  const pd=$('podium'), ls=$('ls'); pd.replaceChildren(); ls.replaceChildren();
  // Podium top 3
  const top3 = [L[1], L[0], L[2]]; // order for podium display (2nd, 1st, 3rd)
  top3.forEach((p, idx) => {
    if(!p) return;
    const rank = idx===0?2 : idx===1?1 : 3;
    const col = el('div', `pod p${rank}`);
    col.innerHTML = `<span class="pn">${p.n}</span><span class="ps">${p.s}</span><div class="pbar"><b>${rank}</b></div>`;
    pd.append(col);
  });
  
  // List for the rest
  L.slice(3).forEach((x,k)=>{
    const r=el('div','row'+(x.u==pid?' me':''));
    r.append(el('span','',k+4),el('span','',x.n),el('b','',x.s));
    ls.append(r);
  });
}
</script></body></html>
